name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Smoke test
        run: |
          # No arguments must print the usage line and exit with 1.
          set +e
          ./dist/filmicca-rec
          test $? -eq 1
