name: Release

# Push a tag such as v1.0.0 to build the executables and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match package.json version $version"; exit 1; }

      - name: Build executables
        run: |
          mkdir -p dist
          for target in linux-x64 darwin-x64 darwin-arm64 windows-x64; do
            out="dist/filmicca-rec-${GITHUB_REF_NAME}-${target}"
            [ "$target" = windows-x64 ] && out="${out}.exe"
            bun build --compile --target="bun-${target}" cli.ts --outfile "$out"
          done
          cd dist && sha256sum filmicca-rec-* > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
